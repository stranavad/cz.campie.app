name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # The automatic pnpm cache needs pnpm on PATH, which is installed only in the next step.
          package-manager-cache: false

      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm test

  # The deployed images build (deploy/compose.yaml); nothing is pushed.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: docker build --target api .
      - run: docker build --target migrate .
      - run: docker build --target app .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
