packages:
  - 'apps/*'
  - 'packages/*'
minimumReleaseAgeExclude:
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - react-dom@19.3.1
  - react@19.3.1
  - vitest@5.0.5
  - '@aws-sdk/client-s3@3.1152.0'
# None of these install scripts is needed: esbuild's and workerd's (under wrangler) only check the binary
# their platform package brings; cpu-features and ssh2 (under Testcontainers) and msgpackr-extract (under
# BullMQ) build optional native speedups; protobufjs's only checks versions.
allowBuilds:
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
  workerd: false
